<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ VOLKA | Official Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* CONFIGURATION GLOBALE */
        :root {
            --accent: #bfff00; 
            --bg: #050505;
            --surface: #111;
            --text-muted: #888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { background-color: var(--bg); color: #fff; font-family: 'Inter', sans-serif; line-height: 1.6; }

        /* NAVIGATION */
        nav { position: fixed; top: 0; width: 100%; padding: 1.5rem 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 1px solid #1a1a1a; }
        .logo { font-weight: 900; font-size: 1.8rem; letter-spacing: -2px; color: var(--accent); text-decoration: none; }
        nav ul { display: flex; list-style: none; gap: 2rem; }
        nav ul a { text-decoration: none; color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 2px; transition: 0.3s; }
        nav ul a:hover { color: var(--accent); }

        /* HERO SECTION */
        header { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: radial-gradient(circle at center, #151515 0%, #050505 100%); padding: 0 5%; }
        .hero-sub { color: var(--accent); letter-spacing: 12px; text-transform: uppercase; font-size: clamp(0.7rem, 2vw, 1rem); margin-bottom: 1rem; }
        header h1 { font-size: clamp(4rem, 20vw, 12rem); font-weight: 900; line-height: 0.8; letter-spacing: -5px; margin-bottom: 2rem; }

        /* MUSIQUE SECTION AVEC BANNIÈRE */
        section { padding: 100px 5%; max-width: 1200px; margin: 0 auto; }
        h2 { font-size: 2.5rem; text-transform: uppercase; margin-bottom: 2rem; border-left: 6px solid var(--accent); padding-left: 1.5rem; }
        
        .music-card {
            background: var(--surface);
            border: 1px solid #222;
            overflow: hidden;
            border-radius: 8px;
        }

        .music-banner {
            width: 100%;
            height: 250px;
            background-image: url('banner.jpg'); /* TON IMAGE ICI */
            background-size: cover;
            background-position: center;
            border-bottom: 2px solid var(--accent);
        }

        .soundcloud-container {
            padding: 10px;
        }

        /* GALLERY SECTION */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 2rem; }
        .gallery-item { aspect-ratio: 1/1; overflow: hidden; background: #111; cursor: pointer; border: 1px solid #1a1a1a; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: 0.5s; }
        .gallery-item:hover img { filter: grayscale(0%); transform: scale(1.05); }

        /* BOUTONS ET FOOTER */
        .btn { display: inline-block; padding: 1rem 2.5rem; background: var(--accent); color: #000; text-decoration: none; font-weight: 900; text-transform: uppercase; transition: 0.3s; margin-top: 20px; }
        .btn:hover { box-shadow: 0 0 20px rgba(191, 255, 0, 0.4); }
        
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .lightbox img { max-width: 90%; max-height: 90%; border: 1px solid var(--accent); }
        .lightbox.active { display: flex; }

        footer { padding: 50px; text-align: center; color: #333; font-size: 0.7rem; border-top: 1px solid #111; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">VOLKA</a>
        <ul>
            <li><a href="#music">Music</a></li>
            <li><a href="#gallery">Visuals</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <header>
        <p class="hero-sub">Raw & Industrial Techno</p>
        <h1>VOLKA</h1>
        <a href="#music" class="btn">Stream Now</a>
    </header>

    <section id="music">
        <h2>Latest <span>Sets</span></h2>
        <div class="music-card">
            <div class="music-banner"></div>
            
            <div class="soundcloud-container">
                <iframe width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay" 
                    src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/paul-goasduf&color=%23bfff00&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=false">
                </iframe>
            </div>
        </div>
    </section>

    <section id="gallery">
        <h2>Visual <span>Archive</span></h2>
        <div class="gallery-grid" id="main-gallery"></div>
    </section>

    <section id="contact" style="text-align: center;">
        <h2>Contact</h2>
        <a href="mailto:djvolka.music@gmail.com" style="color: #fff; font-size: 2rem; font-weight: 900; text-decoration: none;">djvolka.music@gmail.com</a>
    </section>

    <div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
        <img src="" id="lightbox-img">
    </div>

    <footer>VOLKA // 2026</footer>

    <script>
        // Génération galerie photo4 à photo10
        const gallery = document.getElementById('main-gallery');
        for (let i = 4; i <= 10; i++) {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `<img src="photo${i}.jpg" loading="lazy">`;
            item.onclick = () => {
                document.getElementById('lightbox-img').src = `photo${i}.jpg`;
                document.getElementById('lightbox').classList.add('active');
            };
            gallery.appendChild(item);
        }
    </script>
</body>
</html>
